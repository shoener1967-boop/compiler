name: Build roothide tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg xz

      - name: Install roothide Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive --depth 1 \
            https://github.com/roothide/theos.git "$THEOS"

          curl -fL \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        working-directory: DetectionMonitor
        run: |
          make package \
            THEOS_PACKAGE_SCHEME=roothide \
            FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DetectionMonitor-iOS16-roothide
          path: DetectionMonitor/packages/*.deb
          if-no-files-found: error
